x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

x-app: &app
    build: .
    image: meters
    restart: unless-stopped
    env_file: .env
    volumes:
        - storage:/var/www/html/storage
    depends_on:
        db:
            condition: service_healthy
    logging: *logging

services:
    app:
        <<: *app
        environment:
            AUTORUN_ENABLED: "true" # migrate --force, storage:link, optimize on boot
        networks:
            - default
            - traefik
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik
            - traefik.http.routers.meters.rule=Host(`meters.leventeproksa.com`)
            - traefik.http.routers.meters.entrypoints=websecure
            - traefik.http.routers.meters.tls.certresolver=myresolver
            - traefik.http.services.meters.loadbalancer.server.port=8080

    worker:
        <<: *app
        command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=90"]
        stop_signal: SIGTERM
        depends_on:
            app:
                condition: service_healthy # wait for migrations
        healthcheck:
            test: ["CMD", "healthcheck-queue"]
            start_period: 10s

    scheduler:
        <<: *app
        command: ["php", "/var/www/html/artisan", "schedule:work"]
        stop_signal: SIGTERM
        depends_on:
            app:
                condition: service_healthy # wait for migrations
        healthcheck:
            test: ["CMD", "healthcheck-schedule"]
            start_period: 10s

    db:
        image: mysql:8.0
        restart: unless-stopped
        command: --disable-log-bin
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        logging: *logging

networks:
    traefik:
        external: true

volumes:
    db-data:
    storage:
